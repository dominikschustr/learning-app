# Erinnerung ans Tagesziel: abends stündlich prüfen, wer sein Tagesziel noch nicht geschafft hat,
# und eine Mitteilung (Web Push) schicken. Logik: scripts/reminders.mjs.
# Einmalig nötig – Repository → Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT  JSON-Schlüssel eines Firebase-Dienstkontos (Projekteinstellungen → Dienstkonten)
#   VAPID_PRIVATE_KEY         privater Web-Push-Schlüssel (Gegenstück zu PUSH.vapidPublicKey in src/config.ts)
name: Remind

on:
  schedule:
    # 15–21 Uhr UTC = 16/17–22/23 Uhr in Deutschland; die Uhrzeit je Gerät prüft das Skript
    - cron: "2 15-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # nur web-push installieren, nicht die ganze App
      - run: npm install --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/deps" web-push@3.6.7
      - run: node scripts/reminders.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
