# Mitteilungen (Web Push), Logik in scripts/reminders.mjs:
# - Erinnerung ans Tagesziel, wenn es abends zur gewählten Uhrzeit noch offen ist
# - Rangliste: wenn jemand aus der Rangliste gerade lernt
# Einmalig nötig – Repository → Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT  JSON-Schlüssel eines Firebase-Dienstkontos (Projekteinstellungen → Dienstkonten)
#   VAPID_PRIVATE_KEY         privater Web-Push-Schlüssel (Gegenstück zu PUSH.vapidPublicKey in src/config.ts)
name: Remind

on:
  schedule:
    # alle 10 Minuten von 5 bis 21:59 Uhr UTC = 6/7 bis 23/24 Uhr in Deutschland;
    # Uhrzeit und Ruhezeiten je Gerät prüft das Skript
    # (Minuten als Liste statt "3-59/10" – Bereich mit Schrittweite hat GitHub nicht eingeplant)
    - cron: "3,13,23,33,43,53 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # nur web-push installieren, nicht die ganze App
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/deps" web-push@3.6.7
      - run: node scripts/reminders.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
